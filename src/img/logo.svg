<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#5D4E37" rx="8" ry="8"/>

  <!-- Row 1 -->
  <!-- Turmeric (bright yellow-orange) -->
  <circle cx="25" cy="25" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="25" cy="25" r="13" fill="#F4B942"/>

  <!-- Paprika (bright red) -->
  <circle cx="60" cy="25" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="60" cy="25" r="13" fill="#D32F2F"/>

  <!-- Fennel (greenish-gray) -->
  <circle cx="95" cy="25" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="95" cy="25" r="13" fill="#8FA876"/>

  <!-- Row 2 -->
  <!-- Clove (dark brown) -->
  <circle cx="25" cy="60" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="25" cy="60" r="13" fill="#4E342E"/>

  <!-- Thyme (light beige-green) -->
  <circle cx="60" cy="60" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="60" cy="60" r="13" fill="#C5B89A"/>

  <!-- Chili Powder (vibrant red-orange) -->
  <circle cx="95" cy="60" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="95" cy="60" r="13" fill="#E53935"/>

  <!-- Row 3 -->
  <!-- Laurel (greenish-yellow) -->
  <circle cx="25" cy="95" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="25" cy="95" r="13" fill="#B5B832"/>

  <!-- Nutmeg (warm brown-orange) -->
  <circle cx="60" cy="95" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="60" cy="95" r="13" fill="#D4744A"/>

  <!-- Cinnamon (reddish-brown) -->
  <circle cx="95" cy="95" r="16" fill="#B8B8B8" stroke="#9A9A9A" stroke-width="1"/>
  <circle cx="95" cy="95" r="13" fill="#8D5E4A"/>
</svg>